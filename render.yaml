services:
  - type: web
    name: cezar-gym-prod
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PAYMENT_MODE
        value: test
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cezar-gym-db
          property: connectionString
databases:
  - name: cezar-gym-db
    plan: free
    databaseName: cezar_gym
    user: cezar_gym
